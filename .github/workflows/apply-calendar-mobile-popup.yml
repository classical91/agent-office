name: Apply mobile calendar event popup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-calendar-mobile-popup.yml

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add mobile day-event bottom sheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('calendar-view.js'),
              Path('agent-office-deploy/dist/calendar-view.js'),
          ]

          helper_code = r'''

  function isMobileCalendarViewport() {
    return Boolean(window.matchMedia && window.matchMedia('(max-width: 640px)').matches);
  }

  function ensureMobileDayPopupStyles() {
    if (document.getElementById('calendar-mobile-day-popup-styles')) return;
    const style = document.createElement('style');
    style.id = 'calendar-mobile-day-popup-styles';
    style.textContent = `
      .calendar-mobile-day-overlay {
        position: fixed;
        inset: 0;
        z-index: 12000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(2, 6, 23, 0.68);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .calendar-mobile-day-sheet {
        width: 100%;
        max-height: min(74dvh, 680px);
        overflow-y: auto;
        overscroll-behavior: contain;
        border: 1px solid rgba(148, 163, 184, 0.20);
        border-bottom: 0;
        border-radius: 24px 24px 0 0;
        padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.99), rgba(8, 12, 20, 0.99));
        box-shadow: 0 -24px 60px rgba(2, 6, 23, 0.56);
        color: #e2e8f0;
      }
      .calendar-mobile-day-grabber {
        width: 42px;
        height: 4px;
        margin: 0 auto 12px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.36);
      }
      .calendar-mobile-day-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .calendar-mobile-day-title {
        color: #f8fafc;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .calendar-mobile-day-count {
        margin-top: 4px;
        color: #94a3b8;
        font-size: 12px;
      }
      .calendar-mobile-day-close {
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(148, 163, 184, 0.20);
        border-radius: 999px;
        background: rgba(30, 41, 59, 0.76);
        color: #e2e8f0;
        font-size: 18px;
        line-height: 32px;
        cursor: pointer;
      }
      .calendar-mobile-day-list {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .calendar-mobile-day-event {
        display: block;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-left: 4px solid var(--event-color, #38bdf8);
        border-radius: 15px;
        padding: 11px 12px;
        background: rgba(30, 41, 59, 0.66);
        color: #e2e8f0;
        text-align: left;
        text-decoration: none;
        box-sizing: border-box;
      }
      .calendar-mobile-day-event-time {
        display: block;
        color: var(--event-color, #7dd3fc);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .calendar-mobile-day-event-title {
        display: block;
        margin-top: 4px;
        color: #f8fafc;
        font-size: 14px;
        line-height: 1.35;
        font-weight: 750;
      }
      .calendar-mobile-day-event-meta {
        display: block;
        margin-top: 5px;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .calendar-mobile-day-open {
        display: inline-block;
        margin-top: 8px;
        color: #7dd3fc;
        font-size: 11px;
        font-weight: 700;
      }
      .calendar-mobile-day-empty {
        padding: 18px 14px;
        border: 1px dashed rgba(148, 163, 184, 0.22);
        border-radius: 15px;
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }
      @media (min-width: 641px) {
        .calendar-mobile-day-overlay { display: none !important; }
      }
    `;
    document.head.appendChild(style);
  }

  function openMobileDayPopup(value) {
    const date = typeof value === 'string' ? parseDateKey(value) : startOfDay(value);
    state.selectedDate = date;
    state.cursorDate = date;
    state.mobileDayPopupOpen = true;
    render();
  }

  function closeMobileDayPopup() {
    state.mobileDayPopupOpen = false;
    render();
  }

  function renderMobileDayPopup() {
    if (!state.mobileDayPopupOpen || !isMobileCalendarViewport()) return '';
    const items = eventsForDate(state.selectedDate);
    const countLabel = items.length === 1 ? '1 event' : items.length + ' events';
    const rows = items.length
      ? items.map(event => {
          const meta = TYPE_META[event.type] || TYPE_META.meeting;
          const start = parseLocalIso(event.start);
          const end = parseLocalIso(event.end);
          const detail = event.location || event.notes || meta.label;
          const openCopy = event.htmlLink ? '<span class="calendar-mobile-day-open">Open in Google Calendar ↗</span>' : '';
          const tag = event.htmlLink ? 'a' : 'div';
          const href = event.htmlLink ? ' href="' + escapeHtml(event.htmlLink) + '" target="_blank" rel="noopener noreferrer"' : '';
          return '<' + tag + ' class="calendar-mobile-day-event" style="--event-color:' + meta.color + ';"' + href + '>'
            + '<span class="calendar-mobile-day-event-time">' + escapeHtml(formatRange(start, end)) + ' · ' + escapeHtml(meta.label) + '</span>'
            + '<span class="calendar-mobile-day-event-title">' + escapeHtml(event.title) + '</span>'
            + '<span class="calendar-mobile-day-event-meta">' + escapeHtml(detail) + '</span>'
            + openCopy
            + '</' + tag + '>';
        }).join('')
      : '<div class="calendar-mobile-day-empty">Nothing is scheduled on this date.</div>';

    return '<div class="calendar-mobile-day-overlay" role="presentation" onclick="CAL.closeMobileDayPopup()">'
      + '<section class="calendar-mobile-day-sheet" role="dialog" aria-modal="true" aria-label="Events for selected date" onclick="event.stopPropagation()">'
      + '<div class="calendar-mobile-day-grabber"></div>'
      + '<div class="calendar-mobile-day-head">'
      + '<div><div class="calendar-mobile-day-title">' + escapeHtml(formatLongDate(state.selectedDate)) + '</div>'
      + '<div class="calendar-mobile-day-count">' + escapeHtml(countLabel) + '</div></div>'
      + '<button class="calendar-mobile-day-close" type="button" aria-label="Close" onclick="CAL.closeMobileDayPopup()">×</button>'
      + '</div>'
      + '<div class="calendar-mobile-day-list">' + rows + '</div>'
      + '</section></div>';
  }
'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'function renderMobileDayPopup()' not in text:
                  anchor = '  function render() {'
                  if anchor not in text:
                      raise SystemExit(f'Could not find render anchor in {path}')
                  text = text.replace(anchor, helper_code + '\n' + anchor, 1)

              render_anchor = "    const root = document.getElementById('calendar-app');\n    if (!root) return;"
              if 'ensureMobileDayPopupStyles();' not in text:
                  if render_anchor not in text:
                      raise SystemExit(f'Could not find render root anchor in {path}')
                  text = text.replace(render_anchor, render_anchor + '\n    ensureMobileDayPopupStyles();', 1)

              close_anchor = "      + '</section></div>';\n  }\n  function jumpToDate"
              close_replacement = "      + '</section>' + renderMobileDayPopup() + '</div>';\n  }\n  function jumpToDate"
              if close_anchor in text:
                  text = text.replace(close_anchor, close_replacement, 1)
              elif close_replacement not in text:
                  raise SystemExit(f'Could not find render close anchor in {path}')

              jump_anchor = "    if (state.view === 'agenda') state.view = 'day';\n    render();"
              jump_replacement = "    if (state.view === 'agenda') state.view = 'day';\n    state.mobileDayPopupOpen = state.view === 'month' && isMobileCalendarViewport();\n    render();"
              if jump_anchor in text:
                  text = text.replace(jump_anchor, jump_replacement, 1)
              elif jump_replacement not in text:
                  raise SystemExit(f'Could not find jumpToDate anchor in {path}')

              export_anchor = '    jumpToDate,\n'
              export_replacement = '    jumpToDate,\n    openMobileDayPopup,\n    closeMobileDayPopup,\n'
              if export_replacement not in text:
                  if export_anchor not in text:
                      raise SystemExit(f'Could not find CAL export anchor in {path}')
                  text = text.replace(export_anchor, export_replacement, 1)

              path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-calendar-mobile-popup.yml

      - name: Commit patched calendar files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-view.js agent-office-deploy/dist/calendar-view.js .github/workflows/apply-calendar-mobile-popup.yml
          git commit -m "Add mobile day event popup to calendar"
          git push origin HEAD:master
