name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The deployment runs on PostgreSQL, but every other test in the suite runs
    # on file storage, so the Postgres storage layer used to ship with none of
    # its SQL ever executed. That is how an uncast parameter in the Mission
    # Control result write-back reached production and failed there while CI
    # stayed green. tests/postgres-orchestration.test.js exercises it, and skips
    # itself without DATABASE_URL so a laptop `npm test` is unaffected.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: office
          POSTGRES_PASSWORD: office
          POSTGRES_DB: office
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # tests/ui-smoke.test.js skips itself when no browser is around, which is
      # the right answer on a laptop and the wrong one here — a broken install
      # step would take the UI tests out of CI without turning it red. CI=true
      # makes a missing browser a failure instead. Actions sets this already;
      # it is named here so the link between the two is visible.
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Chromium for the UI smoke tests. The browser is versioned with
      # playwright-core, so the cache key is its resolved version: a bump to the
      # dependency fetches a matching browser instead of reusing a stale one.
      - name: Resolve playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      # A cache hit restores the browser but not the system libraries it links
      # against, which live outside the cached directory.
      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium

      - run: npm test
        env:
          DATABASE_URL: postgresql://office:office@localhost:5432/office
          # The service container speaks plain TCP on localhost; TLS is verified
          # separately in tests/postgres-tls.test.js.
          PGSSLMODE: disable
